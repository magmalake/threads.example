name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  run:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.9.0
        with:
          # Pinned: pixi.lock is written by this version, and a newer pixi
          # rejects an older lock with "lock file not up-to-date".
          pixi-version: v0.78.0

      # The same command a reader runs after cloning. Asserts the answer the
      # post quotes, not just that the build succeeds.
      - name: Build and run
        run: |
          pixi run run | tee out.txt
          grep -q 'sum: 499500' out.txt
