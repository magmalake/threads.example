name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  run:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          # Pinned: pixi.lock is written by this version, and a newer pixi
          # rejects an older lock with "lock file not up-to-date".
          pixi-version: v0.78.0

      # The same commands a reader runs after cloning. Asserts the answer the
      # post quotes, not just that the builds succeed.
      - name: Build and run both programs
        run: |
          pixi run run | tee origins.txt
          grep -q 'sum: 499500' origins.txt
          pixi run run-post | tee post.txt
          grep -q 'sum: 499500' post.txt

      # Deliberate misuse: two cases the compiler must reject, four it must
      # still accept (and get wrong in the documented way) — and then each of
      # those four, plus the corrected listing, rebuilt under
      # `--sanitize thread` and checked against the `# expect-tsan:` line in
      # the file.
      #
      # The sanitizer leg runs on macOS and skips itself on Linux: with Mojo
      # 1.0.0 a `--sanitize thread` binary links on linux-64 and then aborts
      # before `main`, because the runtime's bundled TCMalloc cannot get a
      # 1 GiB-aligned mapping inside the address space TSan has reserved. A
      # canary inside check.sh decides, so this stays one command on both.
      - name: Caught and uncaught
        run: pixi run check

      # mojolint must be silent on the post's corrected listing, and must
      # flag every case in tests/uncaught/ — the flip side of the step above.
      - name: Lint (mojolint --lsp)
        run: |
          pixi run lint
          pixi run lint-uncaught
