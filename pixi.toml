[workspace]
authors = ["Marius S <39998+winding-lines@users.noreply.github.com>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "threads.example"
description = "Companion code for the magmalake post on writing multithreaded code in Mojo 1.0 — one file, built against threads-mojo from mojoshelf."
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"
# Required for git source dependencies; `pixi shelf add` says so if it is missing.
preview = ["pixi-build"]

[tasks]
# The post's listing, with the origin kept (src/origins.mojo) …
run = { cmd = "mkdir -p build && mojo build src/origins.mojo -o build/origins && ./build/origins" }
# … and exactly as the post prints it (src/post.mojo).
run-post = { cmd = "mkdir -p build && mojo build src/post.mojo -o build/post && ./build/post" }
fmt = { cmd = "mojo format src" }

[dependencies]
mojo = "==1.0.0"
# Added by `pixi shelf add threads-mojo`: the tin comes from GitHub as a pixi
# source dependency, pinned at the revision mojoshelf published.
threads-mojo = { git = "https://github.com/magmalake/threads.mojo.git", rev = "afa64b0e9ebf7f5dc2079f98b3d0e49dcd7bb6ab" }
