[workspace]
authors = ["Marius S <39998+winding-lines@users.noreply.github.com>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "threads.example"
description = "Companion code for the magmalake post on writing multithreaded code in Mojo 1.0 — one file, built against threads-mojo from mojoshelf."
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"
# Required for git source dependencies; `pixi shelf add` says so if it is missing.
preview = ["pixi-build"]

[tasks]
# The post's listing, with the origin kept (src/origins.mojo) …
run = { cmd = "mkdir -p build && mojo build src/origins.mojo -o build/origins && ./build/origins" }
# … and exactly as the post prints it (src/post.mojo).
run-post = { cmd = "mkdir -p build && mojo build src/post.mojo -o build/post && ./build/post" }
# Deliberate misuse: what the compiler rejects, and what it lets through.
check = { cmd = "bash tests/check.sh" }
fmt = { cmd = "mojo format src tests" }
# mojolint (lint-mojo, below): the origin and threading mistakes the compiler
# lets through, with mojo-lsp-server behind the rules. Exit 1 on findings.
# Only src/origins.mojo — the post's corrected listing — is linted here.
# src/post.mojo and tests/uncaught/*.mojo are deliberate positives (see
# tests/lint_uncaught.sh); tests/caught/*.mojo are deliberately rejected by
# the compiler and never reach mojolint at all.
lint = { cmd = "mojolint --lsp -I src src/origins.mojo" }
# The other half of the claim: mojolint must flag every file in
# tests/uncaught/. See tests/lint_uncaught.sh for what "flag" means here.
lint-uncaught = { cmd = "bash tests/lint_uncaught.sh" }

[dependencies]
mojo = "==1.0.0"
# Added by `pixi shelf add threads-mojo`: the tin comes from GitHub as a pixi
# source dependency, pinned at the revision mojoshelf published.
threads-mojo = { git = "https://github.com/magmalake/threads.mojo.git", rev = "1133606d6de0f48039e7ba2b427575b39b0d2010" }
# Added by `pixi shelf add lint-mojo`: the linter comes from GitHub as a pixi
# source dependency pinned at the revision mojoshelf published, and builds
# the `mojolint` executable into every environment next to mojo-lsp-server.
lint-mojo = { git = "https://github.com/magmalake/lint.mojo.git", rev = "3fa66644756c1de7aece83e5a89375323b6e0ce7" }
